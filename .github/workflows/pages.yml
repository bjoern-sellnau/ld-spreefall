name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test tools/test/*.test.mjs
      - name: Fetch the OSM extract
        # GitHub runners can reach Overpass, so this is the real thing rather
        # than the offline fallback. A live extract for the box is tens of
        # megabytes of XML, hence the larger heap.
        run: node --max-old-space-size=6144 tools/fetch-osm.mjs
      - name: Build the world bundle
        run: node --max-old-space-size=6144 tools/build-world.mjs
      - name: Record which source was used
        run: cat data/raw/source.json
      - name: Build dist
        run: node tools/build-dist.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
