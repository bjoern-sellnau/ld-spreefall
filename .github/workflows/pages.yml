name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test tools/test/*.test.mjs
      - name: The day, so the extract is fetched once a day and no more
        run: echo "OSM_DAY=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Take whatever extracts the city build has already fetched
        # Restore only. The weekly whole city job writes this cache, which is
        # every district of Berlin; a deploy reads it and writes nothing back,
        # because re-uploading gigabytes of XML on every push would cost more
        # than the fetch it saves. Without the cache a deploy still works: it
        # fetches what it can inside the budget below and deploys that.
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: osm-city-${{ env.OSM_DAY }}
          restore-keys: |
            osm-city-
            osm-
      - name: Fetch the OSM extract
        # GitHub runners can reach Overpass, so this is the real thing rather
        # than the offline fallback, and --force ignores the dataset committed
        # to the repository, which exists only so the project builds without a
        # network. A live extract for this box is tens of megabytes of XML,
        # hence the larger heap. If Overpass is down the fetcher falls back on
        # its own and the next step prints which source was used.
        #
        # Two workflows run on every push and both want the same extract, which
        # is rude to a free service that answers in ten seconds when it is not
        # being asked twice at once. The cache key rolls at midnight UTC, so the
        # first run of the day fetches and the rest read what it left. The
        # repository carries a synthetic extract for the offline case, so the
        # check is on where the file came from, not on whether it is there.
        run: |
          if grep -q overpass data/raw/source.json 2>/dev/null; then
            echo "the cache already holds today's live extract"
            cat data/raw/source.json
          else
            node --max-old-space-size=6144 tools/fetch-osm.mjs --force
          fi
      - name: Fetch whatever districts are still missing, inside a budget
        # The deployed city is meant to be all of Berlin. Fetching all eighty
        # one from cold takes an hour and three quarters, nearly all of it
        # waiting on Overpass, so the whole city job does that on its own time
        # and writes the cache; a deploy restores it and spends at most seven
        # minutes topping up whatever is still missing. Seven rather than
        # twenty because this workflow cancels itself when the next push
        # arrives: a deploy that takes half an hour never finishes at all, and
        # then nothing is deployed and nothing is cached.
        #
        # A district that is not there yet is marked unbuilt in the index
        # rather than faked: this runs live only, so Overpass failing leaves a
        # hole instead of writing a synthetic Berlin into the cache.
        continue-on-error: true
        run: |
          timeout 420 node --max-old-space-size=6144 tools/fetch-osm.mjs --all --live-only || true
          ls data/raw/*.osm 2>/dev/null | wc -l
      - name: Keep what was fetched for the next deploy
        # The restore above is shared with the weekly city job; this is the
        # other half of it. The first deploy of the day writes back whatever
        # it managed to add, later ones find the key taken and carry on, and
        # the set of extracts grows towards the whole city over a few runs
        # instead of each deploy fetching the same gaps and throwing them
        # away.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: osm-city-${{ env.OSM_DAY }}
      - name: Build every district that has an extract
        run: node --max-old-space-size=6144 tools/build-world.mjs --all
      - name: Weigh the city against the budget
        run: node tools/weigh-city.mjs
      - name: Check no district is too big to wait for
        run: node tools/fit-city.mjs
      - name: Record which source was used
        run: cat data/raw/source.json
      - name: Build dist
        run: node tools/build-dist.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
